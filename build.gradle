plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
version = providers.gradleProperty('mod_version').get()
group = 'dev.mestorage'
base { archivesName = 'me-storage-controller-forge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
java.withSourcesJar()
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file(project.findProperty('runDir') ?: 'run')
            property 'forge.logging.console.level', 'info'
            if (project.hasProperty('folderRestart')) {
                property 'mestorage.folderRestart', project.property('folderRestart')
            }
            // Remap AE2/GuideME dependency mixins in the named development environment.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--mixin.config', 'me_storage_controller.mixins.json'
            mods { me_storage_controller { source sourceSets.main } }
        }
        client {
            if (project.hasProperty('demo')) {
                property 'mestorage.clientDemo', 'true'
                args '--quickPlaySingleplayer', project.findProperty('demoWorld') ?: 'ME-Controller-Demo', '--width', '1280', '--height', '720'
            }
            if (project.hasProperty('smokeTest')) {
                property 'mestorage.clientSmokeTest', 'true'
                property 'mestorage.smokeOutput', project.file(project.findProperty('smokeOutput') ?: 'build/client-smoke').absolutePath
                args '--quickPlaySingleplayer', 'SmokeTest', '--width', '1280', '--height', '720'
            }
        }
        server { args '--nogui' }
        gameTestServer { property 'forge.enabledGameTestNamespaces', 'me_storage_controller' }
    }
}
repositories {
    maven { url 'https://modmaven.dev' }
    maven { url 'https://maven.guideme.appliedenergistics.org' }
    mavenCentral()
    if (project.hasProperty('eaeTest') || project.hasProperty('mekTest') || project.hasProperty('omniTest') || project.hasProperty('fluxTest')) {
        flatDir { dirs project.findProperty('compatModsDir') ?: 'compat-mods' }
    }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    implementation fg.deobf('appeng:appliedenergistics2-forge:15.4.10')
    implementation fg.deobf('org.appliedenergistics:guideme:20.1.7')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    if (project.hasProperty('eaeTest')) {
        runtimeOnly fg.deobf('local:ExtendedAE:1.20-1.4.21-forge')
        runtimeOnly fg.deobf('local:Glodium:1.20-1.5-forge')
    }
    if (project.hasProperty('mekTest')) {
        runtimeOnly fg.deobf('local:Applied-Mekanistics:1.4.3')
        runtimeOnly fg.deobf('local:Mekanism:1.20.1-10.4.16.80')
    }
    if (project.hasProperty('omniTest')) {
        runtimeOnly fg.deobf('local:ae2omnicells:1.20.1-forge-1.1.6')
    }
    if (project.hasProperty('fluxTest')) {
        runtimeOnly fg.deobf('local:FluxNetworks:1.20.1-7.2.1.15')
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') { useJUnitPlatform() }
tasks.named('processResources') {
    inputs.property 'modVersion', project.version
    filesMatching('META-INF/mods.toml') { expand(modVersion: project.version) }
}
tasks.named('jar') {
    exclude 'dev/mestorage/controller/test/**'
    exclude 'dev/mestorage/controller/client/ClientSmokeTest*'
    exclude 'data/me_storage_controller/structures/empty.nbt'
    from('LICENSE') { into 'META-INF/licenses'; rename { 'MIT.txt' } }
    manifest { attributes 'Implementation-Version': project.version, 'MixinConfigs': 'me_storage_controller.mixins.json' }
    finalizedBy 'reobfJar'
}
